<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyGen.ai - Knowledge Engine</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface2: #111111;
            --border: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #888888;
            --glow: #ffffff;
            --accent: #6C63FF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .container {
            background: var(--surface);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(108, 99, 255, 0.05), 0 0 60px rgba(108, 99, 255, 0.02);
        }
        
        .header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }
        
        .header-icon {
            width: 42px;
            height: 42px;
            background: var(--bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid var(--border);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.1);
        }
        
        .header-text h1 {
            color: var(--text);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        
        .header-text p {
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px #4CAF50;
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 8px #4CAF50;
            }
            50% {
                box-shadow: 0 0 16px #4CAF50, 0 0 24px rgba(76, 175, 80, 0.3);
            }
        }
        
        #chat-container {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: var(--surface);
            scroll-behavior: smooth;
        }
        
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        
        .message-wrapper {
            display: flex;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-wrapper.user {
            justify-content: flex-end;
        }
        
        .message {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 16px;
            position: relative;
            line-height: 1.45;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .message-wrapper.user .message {
            background: var(--text);
            color: var(--bg);
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        
        .message-wrapper.ai .message {
            background: var(--surface2);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            margin: 0 8px;
        }
        
        .message-wrapper.ai .message-avatar {
            background: var(--surface2);
            border: 1px solid var(--border);
        }
        
        .message-wrapper.user .message-avatar {
            background: var(--text);
            color: var(--bg);
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            max-width: 80px;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }
        
        .input-container {
            padding: 16px 20px;
            background: var(--surface2);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #input {
            flex: 1;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        
        #input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.1);
        }
        
        #input::placeholder {
            color: #444;
        }
        
        .btn {
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--surface);
        }
        
        .send-btn {
            width: 42px;
            font-size: 18px;
        }
        
        .send-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .stop-btn {
            width: 42px;
            font-size: 16px;
            display: none;
        }
        
        .stop-btn:hover {
            background: #ff3333;
            border-color: #ff3333;
            color: white;
        }
        
        .stop-btn.active {
            display: flex;
        }
        
        .send-btn.hidden {
            display: none;
        }
        
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            flex-wrap: wrap;
            background: var(--surface);
        }
        
        .suggestion-chip {
            padding: 7px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .suggestion-chip:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .timestamp {
            font-size: 10px;
            color: #444;
            margin-top: 4px;
            padding: 0 8px;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .container {
                border-radius: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            #chat-container {
                flex: 1;
                height: auto;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🧠</div>
            <div class="header-text">
                <h1>KeyGen.ai</h1>
                <p><span class="status-dot"></span>Knowledge Engine</p>
            </div>
        </div>
        
        <div id="chat-container">
            <div class="message-wrapper ai">
                <div class="message-avatar">🧠</div>
                <div>
                    <div class="message">
                        Hello! 👋 I'm KeyGen.ai, a pure knowledge engine. I learn from everything you feed me. Ask me anything or teach me with: <b>learn question : answer</b>
                    </div>
                    <div class="timestamp">Just now</div>
                </div>
            </div>
        </div>
        
        <div class="suggestions">
            <span class="suggestion-chip" onclick="useSuggestion(this)">What is artificial intelligence?</span>
            <span class="suggestion-chip" onclick="useSuggestion(this)">Who won the World Cup 2022?</span>
            <span class="suggestion-chip" onclick="useSuggestion(this)">status</span>
            <span class="suggestion-chip" onclick="useSuggestion(this)">reload knowledge</span>
        </div>
        
        <div class="input-container">
            <input type="text" id="input" placeholder="Ask or teach me something..." autofocus>
            <button class="btn send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            <button class="btn stop-btn" id="stopBtn" onclick="stopGeneration()">■</button>
        </div>
    </div>
    
    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        let isGenerating = false;
        let abortController = null;
        
        function getTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function addMessage(text, isUser) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + (isUser ? 'user' : 'ai');
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👤' : '🧠';
            
            const container = document.createElement('div');
            const message = document.createElement('div');
            message.className = 'message';
            message.textContent = text;
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = getTime();
            
            container.appendChild(message);
            container.appendChild(timestamp);
            
            if (isUser) {
                wrapper.appendChild(container);
                wrapper.appendChild(avatar);
            } else {
                wrapper.appendChild(avatar);
                wrapper.appendChild(container);
            }
            
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return message;
        }
        
        function showTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ai';
            wrapper.id = 'typing-wrapper';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🧠';
            
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
            
            wrapper.appendChild(avatar);
            wrapper.appendChild(indicator);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const typing = document.getElementById('typing-wrapper');
            if (typing) typing.remove();
        }
        
        function setGeneratingState(generating) {
            isGenerating = generating;
            if (generating) {
                sendBtn.classList.add('hidden');
                stopBtn.classList.add('active');
                input.disabled = true;
            } else {
                sendBtn.classList.remove('hidden');
                stopBtn.classList.remove('active');
                input.disabled = false;
                input.focus();
            }
        }
        
        function stopGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            isGenerating = false;
            removeTypingIndicator();
            setGeneratingState(false);
        }
        
        async function typeWriterEffect(element, text, speed = 10) {
            element.textContent = '';
            for (let i = 0; i < text.length; i++) {
                if (!isGenerating) break;
                element.textContent += text.charAt(i);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        }
        
        async function sendMessage() {
            const message = input.value.trim();
            if (!message || isGenerating) return;
            
            addMessage(message, true);
            input.value = '';
            showTypingIndicator();
            setGeneratingState(true);
            
            abortController = new AbortController();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message}),
                    signal: abortController.signal
                });
                
                const data = await response.json();
                removeTypingIndicator();
                
                if (isGenerating) {
                    const aiMessage = addMessage('', false);
                    await typeWriterEffect(aiMessage, data.response, 10);
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    removeTypingIndicator();
                    addMessage('⚠️ Connection error. Please try again.', false);
                }
            }
            
            setGeneratingState(false);
            abortController = null;
        }
        
        function useSuggestion(chip) {
            input.value = chip.textContent;
            sendMessage();
        }
        
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        input.focus();
    </script>
</body>
</html>
